# bun fmt settings. bun fmt is not in stable Bun yet, so it runs through the
# pinned canary (bun@1.4.3-canary.20261014.1, see package.json); the Bun 1.4.3
# runtime and tests ignore this section.
#
# Same options biome.json's formatter had (tabs, width 100, Biome's defaults
# otherwise, which match bun fmt's). sortImports replaces Biome's
# organizeImports.
[fmt]
useTabs = true
printWidth = 100
sortImports = true
sortPackageJson = true
# Biome skipped renovate.json and never formatted Markdown, HTML, YAML or TOML.
ignorePatterns = [
	"renovate.json",
	"**/*.md",
	"**/*.mdx",
	"**/*.html",
	"**/*.yml",
	"**/*.yaml",
	"**/*.toml",
]

# bun lint, also through the pinned canary. Every Biome recommended rule that
# bun lint has an equal of is an error here; Biome (biome.json) keeps only the
# gaps: a11y, rules bun lint lacks, and rules whose bun twin reports more than
# Biome did (those twins are "off" below so nothing reports twice). No rule
# here needs type information, so bun lint stays in its fast mode.
[lint]

[lint.rules]
# Kept in Biome (different behaviour or needs types); off here.
"eslint/no-cond-assign" = "off"
"eslint/no-labels" = "off"
"eslint/no-redeclare" = "off"
"eslint/no-unused-private-class-members" = "off"
"eslint/no-unused-vars" = "off"
"eslint/no-useless-escape" = "off"
"eslint/prefer-arrow-callback" = "off"
"typescript/ban-ts-comment" = "off"
"typescript/consistent-type-exports" = "off"
"typescript/consistent-type-imports" = "off"
"typescript/no-empty-interface" = "off"
"typescript/no-this-alias" = "off"
"typescript/no-unused-vars" = "off"
"typescript/prefer-optional-chain" = "off"
# Biome recommended, covered by bun lint. Options tuned where ESLint is
# stricter than Biome (eqeqeq allows == null; no-use-before-define only
# flags invalid uses).
"eslint/array-callback-return" = "error"
"eslint/constructor-super" = "error"
"eslint/default-case-last" = "error"
"eslint/dot-notation" = "error"
"eslint/eqeqeq" = ["error", "always", { null = "ignore" }]
"eslint/for-direction" = "error"
"eslint/getter-return" = "error"
"eslint/no-array-constructor" = "error"
"eslint/no-async-promise-executor" = "error"
"eslint/no-case-declarations" = "error"
